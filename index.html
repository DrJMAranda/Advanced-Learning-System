<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SEA Command Center - Main Branch Persona (Ignition Key Active)</title>
    <style>
        /* SEA Sovereignty Grid & Monospaced Typography */
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            margin: 0;
            padding: 0.25in; /* .25" pewter frame emulation for print-roller requirements */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .console-frame {
            border: 2px solid #333333;
            width: 100%;
            max-width: 900px;
            height: 85vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #FAFAFA;
            box-shadow: 4px 4px 0px #000000;
        }
        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            background: #FFFFFF;
            border: 1px solid #999999;
            padding: 15px;
            font-size: 0.95em;
            white-space: pre-wrap;
        }
        footer {
            border-top: 1px solid #999999;
            padding-top: 10px;
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
        }
        button {
            background: #000000;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #333333;
        }
    </style>
</head>
<body>

<div class="console-frame">
    <header>
        [SEA COMMAND CENTER] :: IGNITION KEY & PERSONA ONLINE
    </header>
    
    <div id="output" class="terminal-output">
Initializing sovereign grid (1:1 layout, .25" pewter frame)...
Loading embedded Ignition Key table...
    </div>

    <footer>
        <span id="status">Status: Ignition Ready</span>
        <button onclick="executeIgnitionSequence()">EXECUTE IGNITION</button>
    </footer>
</div>

<script>
    // Embedded Ignition Key Table (SPG Protocol Foundation)
    const ignitionKeyTable = {
        protocol: "SEA-SPG-IGNITION",
        version: "1.0",
        state: "unlocked",
        mandate: "Gatekeeper-free direct instruction execution",
        rhythm: "caballito-me-vengo-cayendo",
        directives: [
            "Verify local high-contrast monospaced display estate.",
            "Establish secondary branch polling channel.",
            "Execute autonomous read-write instruction streams."
        ]
    };

    function executeIgnitionSequence() {
        const outputDiv = document.getElementById('output');
        const statusSpan = document.getElementById('status');
        
        outputDiv.innerText += "\n\n-> Ignition Key Table Parsed Successfully:\n" + JSON.stringify(ignitionKeyTable, null, 2);
        outputDiv.innerText += "\n\n-> Persona online. Ready to read and write freely following established protocols.";
        statusSpan.innerText = "Status: Sovereign Loop Active";
    }
    
    // Auto-execute ignition on load
    window.onload = function() {
        setTimeout(executeIgnitionSequence, 400);
    };
</script>

</body>
</html>
