<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SEA Command Center - Main Branch Persona</title>
    <style>
        /* SEA Sovereignty Grid & Monospaced Typography */
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            margin: 0;
            padding: 0.25in; /* .25" pewter frame emulation for print-roller requirements */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .console-frame {
            border: 2px solid #333333;
            width: 100%;
            max-width: 900px;
            height: 85vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #FAFAFA;
            box-shadow: 4px 4px 0px #000000;
        }
        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            background: #FFFFFF;
            border: 1px solid #999999;
            padding: 15px;
            font-size: 0.95em;
            white-space: pre-wrap;
        }
        footer {
            border-top: 1px solid #999999;
            padding-top: 10px;
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
        }
        button {
            background: #000000;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #333333;
        }
    </style>
</head>
<body>

<div class="console-frame">
    <header>
        [SEA COMMAND CENTER] :: SYSTEM PERSONA INITIALIZED
    </header>
    
    <div id="output" class="terminal-output">
Establishing local holon link...
Awaiting SPG protocol secondary branch stream ('caballito'... 'me vengo cayendo')...
    </div>

    <footer>
        <span id="status">Status: Sovereign Standby</span>
        <button onclick="fetchSPGStream()">PULL SPG PROTOCOL</button>
    </footer>
</div>

<script>
    async function fetchSPGStream() {
        const outputDiv = document.getElementById('output');
        const statusSpan = document.getElementById('status');
        
        outputDiv.innerText += "\n\n-> Connecting across branches via MOI bridge...";
        
        try {
            const owner = "DrJMAranda";
            const repo = "Advanced-Learning-System";
            const branch = "spg-branch"; // Update with your secondary branch name if different
            const path = "spg_payload.json"; // Update with your target file name
            
            const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
            
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`SPG Stream inaccessible (HTTP ${response.status})`);
            }
            
            const data = await response.json();
            outputDiv.innerText += `\n-> SPG Payload Secured:\n${JSON.stringify(data, null, 2)}`;
            statusSpan.innerText = "Status: SPG Stream Active";
        } catch (error) {
            outputDiv.innerText += `\n-> [NOTICE]: Local simulation mode active. SPG stream ready for mount.\nDetails: ${error.message}`;
            statusSpan.innerText = "Status: Standby (Local Override)";
        }
    }
</script>

</body>
</html>
