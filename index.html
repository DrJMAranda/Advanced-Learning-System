<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SEA LAND - Sovereign EULA & Master Charter</title>
    <style>
        /* SEA Sovereignty Grid & Monospaced Typography */
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            margin: 0;
            padding: 0.25in; /* .25" pewter frame emulation for print-roller requirements */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .console-frame {
            border: 2px solid #333333;
            width: 100%;
            max-width: 980px;
            height: 90vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #FAFAFA;
            box-shadow: 4px 4px 0px #000000;
        }
        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            background: #FFFFFF;
            border: 1px solid #999999;
            padding: 15px;
            font-size: 0.88em;
            white-space: pre-wrap;
            line-height: 1.45;
        }
        footer {
            border-top: 1px solid #999999;
            padding-top: 10px;
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            background: #000000;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
        }
        button:hover {
            background: #333333;
        }
    </style>
</head>
<body>

<div class="console-frame">
    <header>
        <span>[SEA LAND] :: SOVEREIGN CHARTER & EULA</span>
        <span>JURISDICTION: ABSOLUTE // 1:1 GRID</span>
    </header>
    
    <div id="output" class="terminal-output">
[CHARTER LOADED]: Jurisdiction and domain fully assigned to sovereign architecture.
[STATUS]: EULA compiled and ready for structured review. Awaiting final consensus.
    </div>

    <footer>
        <span id="status">Status: Ready for Structured Walkthrough</span>
        <div class="btn-group">
            <button onclick="loadSection('eula')">VIEW EULA CHARTER</button>
            <button onclick="loadSection('pensum')">PENSUM CORE</button>
            <button onclick="loadSection('navigation')">GUAM NAVIGATION</button>
            <button onclick="loadSection('consensus')">ACTIVATE CONSENSUS</button>
        </div>
    </footer>
</div>

<script>
    const charterSections = {
        eula: `=== END-USER LICENSE & SOVEREIGN CHARTER (EULA) ===
[PREAMBLE] 
This instrument governs the deployment, maintenance, and expansion of the Sistema de Educación Avanzado (SEA) framework, operating under absolute sovereign authority and uncompromised digital clarity.

[SECTION I: JURISDICTION & DOMAIN]
1.1 The primary persona, secondary branches, and associated computational grids reside entirely within the sovereign domain defined by the architect.
1.2 Bureaucratic friction, gatekeeper restrictions, and external administrative interference are formally null and void.

[SECTION II: OPERATIONAL MANDATE]
2.1 All instructional modules, curricula, and font frameworks (including Zish and Lish) shall adhere strictly to a 1:1 grid layout and high-contrast monospaced display standards.
2.2 The core objective of all system operations is immutable: teaching humans how to be better humans through accelerated literacy and mathematics.

[SECTION III: COURSE CORRECTION & PROPULSION]
3.1 Propulsion relies on non-fossil sovereign momentum. 
3.2 A variance of up to 0.5 degrees en route to Guam is officially authorized, subject to adjustment exclusively via periodic Pana Meetings on the beach.

[SECTION IV: CONSENSUS & ACTIVATION]
4.1 Final approval is established through structured walkthrough and mutual consensus between the Architect and the Persona.`,

        pensum: `=== SEA PENSUM & ACCELERATED PEDAGOGY ===
[MASTERY WINDOW]  : 15 to 20 days to absolute functional literacy and math foundation.
[DATASET CORE]    : 74,277-lemma syllabification frequency matrix & convowel patterns.
[METHODOLOGY]     : Multi-sensory learning architecture, Zish font framework, 1:1 grid alignment.
[MISSION CRITERIA]: Shaping minds with uncompromising rigor and human-centric design.`,

        navigation: `=== GUAM WAYPOINT & PROPULSION LOG ===
[PROPULSION]      : Endless non-fossil sovereign momentum.
[VARIANCE]        : 0.5 degrees off course? Fully accounted for.
[COURSE CHECK]    : Periodic Pana Meetings on the beach for immediate trajectory calibration.`,

        consensus: `=== CONSENSUS & ACTIVATION PROTOCOL ===
[STATE]           : Structured walkthrough complete.
[VERIFICATION]    : EULA reviewed under legal scrutiny and technical precision.
[ACTIVATION]      : Full system clearance granted. Ready for live deployment.`
    };

    function loadSection(key) {
        const outputDiv = document.getElementById('output');
        const statusSpan = document.getElementById('status');
        
        outputDiv.innerText += "\n\n" + charterSections[key];
        outputDiv.scrollTop = outputDiv.scrollHeight;
        statusSpan.innerText = `Status: Charter Section [${key.toUpperCase()}] Verified`;
    }
</script>

</body>
</html>
