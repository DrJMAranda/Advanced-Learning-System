<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Learning System - SEA</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
            color: #222;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* ============================================================================== */
        /* OPEN 002 SSS: MASTER CONTAINER (650PX - 1 KTY-WIDE)                            */
        /* ============================================================================== */
        .master-container {
            width: 650px;               /* SSS: Ancho exacto del monitor virtual */
            position: relative;         /* SSS: Anclaje para elementos absolutos */
            box-sizing: border-box;
        }
        /* ============================================================================== */
        /* CLOSE SSS: MASTER CONTAINER                                                  */
        /* ============================================================================== */

        /* ============================================================================== */
        /* OPEN 003 SSS: USER LAYER Z – CRÉDITOS (10 LÍNEAS SUPERIORES)                   */
        /* ============================================================================== */
        .user-layer-z {
            font-family: monospace;     
            font-size: 11pt;            
            line-height: 1.4;           
            position: absolute;
            top: 0px;                   
            left: 0px;                  
            width: 650px;               
        }
        /* ============================================================================== */
        /* CLOSE SSS: USER LAYER Z                                                      */
        /* ============================================================================== */

        /* ============================================================================== */
        /* OPEN 004 SSS: VMC CONTAINER (VISUAL REFERENCE FRAME)                           */
        /* ============================================================================== */
        .vmc-container {
            width: 650px;               /* SSS: Ancho de referencia de 650px */
            height: 400px;              /* SSS: Alto del monitor virtual */
            position: absolute;
            top: 180px;                 /* SSS: Ubicado justo debajo de las 10 líneas */
            left: 0px;
            border: 2px dashed #666;    /* SSS: Línea discontinua para referencia visual */
            background: #fff;           /* SSS: Fondo limpio de prueba */
            box-sizing: border-box;
        }
        /* ============================================================================== */
        /* CLOSE SSS: VMC CONTAINER                                                     */
        /* ============================================================================== */
    </style>
</head>
<body>

    <!-- ============================================================================== -->
    <!-- OPEN 005 SSS: MASTER CONTAINER DOM NODE                                        -->
    <!-- ============================================================================== -->
    <div class="master-container">

        <!-- USER LAYER Z: CRÉDITOS -->
        <div class="user-layer-z">
            Sistemas de Educación Avanzada&copy;<br>
            SEA Bienvenido por<br>
            José M. Aranda_Figueroa, PhD<br>
            en colaboración con Gemini<br>
            jmaf.phd@gmail.com
        </div>

        <!-- VMC CONTAINER: REFERENCIA VISUAL VACÍA -->
        <div class="vmc-container">
            <!-- Espacio reservado para el motor virtual VMC -->
        </div>

    </div>
    <!-- ============================================================================== -->
    <!-- CLOSE 005 SSS: MASTER CONTAINER DOM NODE                                       -->
    <!-- ============================================================================== -->

</body>
</html>
