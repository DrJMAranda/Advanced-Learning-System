<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEA / KTU Fixed-Layout Viseme &amp; DST</title>
  <style>
    :root {
      --bg: #ffffff;
      --paper: #faf6ee;
      --fg: #111111;
      --muted: #444444;
      --border: #111111;
      --grid: rgba(17, 17, 17, 0.16);
      --mono: "Consolas", "Courier New", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #777777;
      color: var(--fg);
      font-family: var(--mono);
    }
    .sheet {
      width: 760px;
      max-width: 100%;
      margin: 0 auto;
      background: var(--bg);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }
    .top-bar input[type="text"] {
      font-family: var(--mono);
      font-size: 14px;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      background: var(--paper);
      color: var(--fg);
      width: 220px;
    }
    button {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }
    button.primary { background: var(--fg); color: var(--bg); }

    /* Zone 1: Fixed Top Stage */
    .stage-box {
      position: relative;
      height: 230px;
      border: 2px solid var(--border);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-box canvas { display: block; }

    /* Zone 2: Fixed 3-Column Middle Row */
    .mid-row {
      display: grid;
      grid-template-columns: 160px 1fr 180px;
      gap: 12px;
      align-items: center;
    }
    .portrait-slot, .tract-slot {
      border: 1.5px solid var(--border);
      background: var(--paper);
      padding: 6px;
      text-align: center;
    }
    .center-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .pair-line {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .wave-bar {
      height: 22px;
      flex: 1;
      max-width: 170px;
      border: 1.5px solid var(--border);
      background: linear-gradient(90deg, #555 15%, #999 45%, #333 75%, #888 100%);
    }
    .word-tag {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* Zone 3: Fixed Bottom Split Ergonomic Deck */
    .deck-row {
      border-top: 1.5px solid var(--border);
      padding-top: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: end;
    }
    .key-cluster {
      display: grid;
      grid-template-columns: repeat(4, 34px);
      gap: 3px;
      justify-content: center;
    }
    .key-cluster.left-pad { transform: rotate(-14deg); }
    .key-cluster.right-pad { transform: rotate(14deg); }
    .k-cap {
      height: 28px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .space-bar {
      padding: 4px 14px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      font-weight: 700;
    }
    .status-strip {
      font-size: 12px;
      border-top: 1.5px solid var(--border);
      padding-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="top-bar">
      <div>
        <input type="text" id="wordInput" value="pollito chick" aria-label="Word input" />
        <button class="primary" id="btnPlay">&#9654; Play</button>
        <button id="btnStop">&#9724; Stop</button>
      </div>
      <div>
        <button id="btnFaster" title="Smaller delay = faster">+ Faster</button>
        <button id="btnSlower" title="Larger delay = slower">- Slower</button>
        <span id="delayLabel">40ms</span>
      </div>
    </div>

    <!-- Fixed Zone 1: Top Stage -->
    <div class="stage-box">
      <canvas id="stageCanvas" width="220" height="210"></canvas>
    </div>

    <!-- Fixed Zone 2: Middle Row -->
    <div class="mid-row">
      <div class="portrait-slot">
        <canvas id="portraitCanvas" width="144" height="144"></canvas>
      </div>

      <div class="center-stack">
        <div class="pair-line">
          <span>&#128266;</span>
          <div class="wave-bar"></div>
        </div>
        <div class="word-tag" id="tagPrimary">p o l l i t o</div>
        <div class="pair-line">
          <span>&#128266;</span>
          <div class="wave-bar"></div>
        </div>
        <div class="word-tag" id="tagSecondary">c h i c k</div>
      </div>

      <div class="tract-slot">
        <canvas id="tractCanvas" width="164" height="144"></canvas>
      </div>
    </div>

    <!-- Fixed Zone 3: Bottom Split Keyboard -->
    <div class="deck-row">
      <div class="key-cluster left-pad" id="leftPad"></div>
      <div class="space-bar" id="spaceBar">Q | space | J</div>
      <div class="key-cluster right-pad" id="rightPad"></div>
    </div>

    <div class="status-strip">
      <span id="statusTick">Tick: 0</span>
      <span id="statusViseme">Viseme: 0 (Rest)</span>
      <span id="statusDst">DST: 0 deltas</span>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* Single inline patcher state: no competing clocks or resets */
      const Patcher = {
        delayMs: 40,
        minMs: 12,
        maxMs: 240,
        stepMs: 8,
        t1SilentFirst: true,
        stepSpeed(sign) {
          this.delayMs = sign > 0
            ? Math.max(this.minMs, this.delayMs - this.stepMs)
            : Math.min(this.maxMs, this.delayMs + this.stepMs);
          document.getElementById("delayLabel").textContent = this.delayMs + "ms";
        },
        isSilentFirst(tick) {
          return this.t1SilentFirst && tick > 0 && tick % 2 === 1;
        }
      };

      const VISEME_SHAPES = {
        0: { label: "0 (Rest)",  mouthW: 16, mouthH: 3 },
        1: { label: "1 (Smile)", mouthW: 28, mouthH: 8 },
        2: { label: "2 (Open)",  mouthW: 24, mouthH: 18 },
        3: { label: "3 (Round)", mouthW: 12, mouthH: 14 },
        4: { label: "4 (F/V)",   mouthW: 22, mouthH: 6 },
        5: { label: "5 (M/B/P)", mouthW: 20, mouthH: 2 }
      };

      const LOCI_DOTS = [
        { x: 34,  y: 78, c: "#dc2626" },
        { x: 48,  y: 76, c: "#ea580c" },
        { x: 60,  y: 72, c: "#eab308" },
        { x: 74,  y: 66, c: "#65a30d" },
        { x: 88,  y: 62, c: "#16a34a" },
        { x: 102, y: 64, c: "#0891b2" },
        { x: 114, y: 74, c: "#2563eb" },
        { x: 120, y: 90, c: "#7c3aed" },
        { x: 116, y: 108, c: "#db2777" }
      ];

      function buildTimeline(text) {
        const clean = (text || "").toLowerCase();
        const seq = [0];
        for (let i = 0; i < clean.length; i++) {
          const ch = clean[i];
          if ("aáàâ".includes(ch)) seq.push(2, 2);
          else if ("eiíìy".includes(ch)) seq.push(1, 1);
          else if ("ouóúòù".includes(ch)) seq.push(3, 3);
          else if ("fv".includes(ch)) seq.push(4);
          else if ("mbp".includes(ch)) seq.push(5);
          else if (/[a-zñ]/.test(ch)) seq.push(1);
          else seq.push(0);
        }
        seq.push(0);
        return seq;
      }

      function countDstDeltas(seq) {
        let deltas = 0;
        let prev = -1;
        for (let i = 0; i < seq.length; i++) {
          if (seq[i] !== prev) {
            deltas++;
            prev = seq[i];
          }
        }
        return deltas;
      }

      function renderStage(tick, vId) {
        const c = document.getElementById("stageCanvas");
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);

        const shape = VISEME_SHAPES[vId] || VISEME_SHAPES[0];
        const bob = Math.sin(tick * 0.35) * 2;

        /* Body & head */
        ctx.fillStyle = "#facc15";
        ctx.strokeStyle = "#111111";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(110, 134 + bob, 44, 52, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(114, 72 + bob, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        /* Wing */
        ctx.beginPath();
        ctx.ellipse(88, 128 + bob, 14, 26, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        /* Eye */
        ctx.fillStyle = "#111111";
        ctx.beginPath();
        ctx.arc(124, 64 + bob, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(126, 62 + bob, 1.8, 0, Math.PI * 2);
        ctx.fill();

        /* Inline Viseme Mouth */
        ctx.fillStyle = "#111111";
        ctx.beginPath();
        ctx.ellipse(136, 79 + bob, shape.mouthW * 0.5, shape.mouthH * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        /* Feet */
        ctx.strokeStyle = "#ea580c";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(96, 184); ctx.lineTo(90, 202); ctx.lineTo(78, 204);
        ctx.moveTo(124, 184); ctx.lineTo(130, 202); ctx.lineTo(142, 204);
        ctx.stroke();
      }

      function renderPortrait() {
        const c = document.getElementById("portraitCanvas");
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#d8cfc2";
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.fillStyle = "#b89f88";
        ctx.strokeStyle = "#111111";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(72, 68, 28, 36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#3a2e25";
        ctx.beginPath();
        ctx.arc(72, 54, 28, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "#8d7b6c";
        ctx.beginPath();
        ctx.ellipse(72, 126, 46, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      function renderTract(tick) {
        const c = document.getElementById("tractCanvas");
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#f4f1ea";
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.strokeStyle = "#111111";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(22, 76);
        ctx.quadraticCurveTo(75, 22, 134, 48);
        ctx.lineTo(124, 136);
        ctx.stroke();

        const activeIdx = tick % LOCI_DOTS.length;
        for (let i = 0; i < LOCI_DOTS.length; i++) {
          const d = LOCI_DOTS[i];
          ctx.fillStyle = d.c;
          ctx.beginPath();
          ctx.arc(d.x, d.y, i === activeIdx ? 5.5 : 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }

      function buildPads() {
        const leftKeys = ["C1","C2","C3","Q","K","Y","U","N","W","P","O","I","X","H","C",""];
        const rightKeys = ["J","F1","F2","F3","R","D","E","F","S","T","G","V","S","L","M","Z"];
        const lp = document.getElementById("leftPad");
        const rp = document.getElementById("rightPad");
        lp.innerHTML = leftKeys.map(k => `<div class="k-cap">${k}</div>`).join("");
        rp.innerHTML = rightKeys.map(k => `<div class="k-cap">${k}</div>`).join("");
      }

      let timeline = buildTimeline("pollito chick");
      let tick = 0;
      let timer = null;

      function updateView() {
        const vId = timeline[tick] || 0;
        const shape = VISEME_SHAPES[vId] || VISEME_SHAPES[0];
        renderStage(tick, vId);
        renderTract(tick);
        document.getElementById("statusTick").textContent = "Tick: " + tick;
        document.getElementById("statusViseme").textContent = "Viseme: " + shape.label;
        document.getElementById("statusDst").textContent = "DST: " + countDstDeltas(timeline) + " deltas";
      }

      function stopLoop() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function startLoop() {
        stopLoop();
        timeline = buildTimeline(document.getElementById("wordInput").value);
        tick = 0;
        updateView();
        timer = setInterval(() => {
          tick++;
          if (tick >= timeline.length) {
            tick = 0;
          }
          updateView();
        }, Patcher.delayMs);
      }

      document.getElementById("btnPlay").addEventListener("click", startLoop);
      document.getElementById("btnStop").addEventListener("click", () => {
        stopLoop();
        tick = 0;
        updateView();
      });
      document.getElementById("btnFaster").addEventListener("click", () => {
        Patcher.stepSpeed(+1);
        if (timer !== null) startLoop();
      });
      document.getElementById("btnSlower").addEventListener("click", () => {
        Patcher.stepSpeed(-1);
        if (timer !== null) startLoop();
      });

      buildPads();
      renderPortrait();
      updateView();
    })();
  </script>
</body>
</html>
