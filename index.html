<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KT Silent Egg</title>
<style>
  body {
    margin: 0;
    padding: 8px;
    background: #FAF6EE;
    color: #000000;
    font-family: "Courier New", Courier, monospace;
  }
  #locus {
    width: 300px;
    border: 2px solid #000000;
    background: #FFFFFF;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  #slot-1-img {
    display: block;
    width: 280px;
    height: 190px;
    object-fit: contain;
    border: 1px solid #000000;
  }
  .row {
    height: 36px;
    border: 1px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
  }
  #pace-bar {
    width: 300px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  #pace-readout {
    flex: 1.2;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    border: 1px solid #000000;
    background: #FFFFFF;
    padding: 7px 4px;
  }
  button {
    flex: 1;
    padding: 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    background: #FFFFFF;
    color: #000000;
    border: 2px solid #000000;
  }
  #go {
    width: 300px;
    display: block;
  }
</style>
</head>
<body>
<div id="locus">
  <img id="slot-1-img" src="https://storage.googleapis.com/noenbalde/Imagemes/shark.JPG" alt="shark">
  <div id="slot-2-es" class="row"></div>
  <div id="slot-3-en" class="row"></div>
</div>

<div id="pace-bar">
  <button id="slower">-</button>
  <div id="pace-readout">1.50s</div>
  <button id="faster">+</button>
</div>
<button id="go">PRESENT</button>

<script>
const esEl = document.getElementById("slot-2-es");
const enEl = document.getElementById("slot-3-en");
const readoutEl = document.getElementById("pace-readout");

const STEP_MS = 250;
const MIN_MS  = 500;
const MAX_MS  = 4000;
let delayMs   = 1500;
let busy      = false;

function updateReadout() {
  readoutEl.textContent = (delayMs / 1000).toFixed(2) + "s";
}

function beat() {
  return new Promise(r => setTimeout(r, delayMs));
}

document.getElementById("slower").onclick = () => {
  delayMs = Math.min(MAX_MS, delayMs + STEP_MS);
  updateReadout();
};

document.getElementById("faster").onclick = () => {
  delayMs = Math.max(MIN_MS, delayMs - STEP_MS);
  updateReadout();
};

document.getElementById("go").onclick = async () => {
  if (busy) return;
  busy = true;
  esEl.textContent = "";
  enEl.textContent = "";

  await beat();
  esEl.textContent = "tiburón";

  await beat();
  enEl.textContent = "shark";

  busy = false;
};
</script>
</body>
</html>
