<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay-T Come y Vete — 100-Egg Plug & Play</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
  }
  .stage {
    width: 100%;
    max-width: 360px;
    border: 2px solid #000000;
    padding: 12px;
    text-align: center;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: bold;
    border-bottom: 1px solid #000;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .latereme {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1px solid #000;
    background: #ffffff;
    vertical-align: middle;
  }
  .latereme.on { background: #cc0000; }
  .img-box {
    width: 100%;
    height: 200px;
    border: 1px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .img-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .es-lemma { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
  .en-lemma { font-size: 20px; margin-bottom: 12px; }
  .controls {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:active { background: #000000; color: #ffffff; }
  #btn-lesson { width: 100%; margin-top: 8px; }
</style>
</head>
<body>

<div class="stage">
  <div class="top-bar">
    <span id="lesson-lbl">L01</span>
    <span id="counter">0001 / 0100</span>
    <span>LAT: <span id="lat" class="latereme"></span></span>
    <span id="speed-lbl">1200ms</span>
  </div>

  <div class="img-box">
    <img id="pic" src="" alt="">
  </div>

  <div id="es" class="es-lemma">---</div>
  <div id="en" class="en-lemma">---</div>

  <div class="controls">
    <button id="btn-prev">&lt;</button>
    <button id="btn-play">PLAY</button>
    <button id="btn-next">&gt;</button>
    <button id="btn-fast">+</button>
    <button id="btn-slow">-</button>
    <button id="btn-lesson">NEXT LESSON</button>
  </div>
</div>

<script>
// DROP YOUR 100-EGG LESSONS HERE: each entry is one 100-item carton
const LESSONS = [
  [
    ["0001_cat.jpg", "gato", "cat"],
    ["0002_dog.jpg", "perro", "dog"],
    ["0003_pig.jpg", "cerdo", "pig"]
  ],
  [
    ["0101_sun.jpg", "sol", "sun"],
    ["0102_sky.jpg", "cielo", "sky"],
    ["0103_sea.jpg", "mar", "sea"]
  ]
];

let lessonIdx = 0, idx = 0, delay = 1200, timer = null;
const elLesson  = document.getElementById("lesson-lbl");
const elCounter = document.getElementById("counter");
const elPic     = document.getElementById("pic");
const elEs      = document.getElementById("es");
const elEn      = document.getElementById("en");
const elLat     = document.getElementById("lat");
const elSpeed   = document.getElementById("speed-lbl");
const btnPlay   = document.getElementById("btn-play");

function currentBatch() { return LESSONS[lessonIdx]; }

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-ES";
  u.onstart = () => elLat.classList.add("on");
  u.onend   = () => elLat.classList.remove("on");
  u.onerror = () => elLat.classList.remove("on");
  window.speechSynthesis.speak(u);
}

function render() {
  const batch = currentBatch();
  const [file, es, en] = batch[idx];
  elLesson.textContent  = "L" + String(lessonIdx + 1).padStart(2, "0");
  elCounter.textContent = String(idx + 1).padStart(4, "0") + " / " + String(batch.length).padStart(4, "0");
  elPic.src = file;
  elPic.alt = en;
  elEs.textContent = es;
  elEn.textContent = en;
  elLat.classList.remove("on");
  speak(es);
}

function next() { idx = (idx + 1) % currentBatch().length; render(); }
function prev() { idx = (idx - 1 + currentBatch().length) % currentBatch().length; render(); }

function nextLesson() {
  lessonIdx = (lessonIdx + 1) % LESSONS.length;
  idx = 0;
  render();
}

function togglePlay() {
  if (timer) {
    clearInterval(timer);
    timer = null;
    btnPlay.textContent = "PLAY";
  } else {
    btnPlay.textContent = "STOP";
    render();
    timer = setInterval(next, delay);
  }
}

document.getElementById("btn-play").onclick   = togglePlay;
document.getElementById("btn-next").onclick   = next;
document.getElementById("btn-prev").onclick   = prev;
document.getElementById("btn-lesson").onclick = nextLesson;
document.getElementById("btn-fast").onclick   = () => {
  delay = Math.max(300, delay - 200);
  elSpeed.textContent = delay + "ms";
  if (timer) { clearInterval(timer); timer = setInterval(next, delay); }
};
document.getElementById("btn-slow").onclick   = () => {
  delay = Math.min(4000, delay + 200);
  elSpeed.textContent = delay + "ms";
  if (timer) { clearInterval(timer); timer = setInterval(next, delay); }
};

render();
</script>
</body>
</html>
