<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEA~ALS | Knowledge Transfer Unit (KTU)</title>
  <style>
    :root {
      --bg-paper: #FAF6EE;
      --ink-black: #000000;
      --pewter: #8E9294;
      --accent: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--pewter);
      color: var(--ink-black);
      font-family: 'B612 Mono', 'IBM Plex Mono', 'Courier New', Courier, monospace;
      font-size: 14pt;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.25in;
    }

    /* 1:1 Portrait Frame with .25" Pewter Margin */
    .ktu-frame {
      width: 100%;
      max-width: 8.5in;
      min-height: 11in;
      background-color: var(--bg-paper);
      border: 2px solid var(--ink-black);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5in;
    }

    .title-block {
      border-bottom: 2px solid var(--ink-black);
      padding-bottom: 12px;
      line-height: 1.4;
      font-size: 12pt;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px 0;
    }

    /* Imageme + Viseme Synchronized Viewport */
    .visual-bay {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
    }

    .card-box {
      border: 2px solid var(--ink-black);
      background: #FFFFFF;
      width: 260px;
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10pt;
      font-weight: bold;
    }

    .card-box img {
      max-width: 210px;
      max-height: 210px;
      object-fit: contain;
    }

    .viseme-glyph {
      font-size: 48pt;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* Fixed-Grid Monospace Text Readout */
    .lexeme-display {
      font-size: 32pt;
      font-weight: bold;
      letter-spacing: 0.15em;
      min-height: 54px;
      text-align: center;
      border-top: 1px solid var(--ink-black);
      border-bottom: 1px solid var(--ink-black);
      padding: 8px 24px;
      width: 100%;
    }

    .phase-indicator {
      font-size: 12pt;
      height: 24px;
    }

    /* Speedometer & Transport Controls */
    .controls {
      border-top: 2px solid var(--ink-black);
      padding-top: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      font-family: inherit;
      font-size: 13pt;
      font-weight: bold;
      background: #FFFFFF;
      color: var(--ink-black);
      border: 2px solid var(--ink-black);
      padding: 8px 16px;
      cursor: pointer;
    }

    button:active {
      background: var(--ink-black);
      color: var(--bg-paper);
    }

    .speed-readout {
      font-size: 13pt;
      font-weight: bold;
      padding: 0 8px;
    }
  </style>
</head>
<body>
  <div class="ktu-frame">
    <header class="title-block">
      <div>Sistemas de Educación Avanzada&copy; / SEA Bienvenido por</div>
      <div>José M. Aranda-Figueroa, PhD &mdash; en colaboración con Gemini</div>
      <div>jmaf.phd@gmail.com | KTU Silent-Sequence + Viseme Sync</div>
    </header>

    <main class="stage">
      <div class="visual-bay">
        <!-- Imageme Slot (GCS noembalde/imagemes) -->
        <div class="card-box">
          <span class="card-label">IMAGEME [T1]</span>
          <img id="imageme-img" src="" alt="Imageme" />
        </div>

        <!-- Viseme / Latereme Slot -->
        <div class="card-box">
          <span class="card-label">VISEME [ATHENA]</span>
          <img id="viseme-img" src="" alt="" style="display:none;" />
          <div id="viseme-fallback" class="viseme-glyph">[ — ]</div>
        </div>
      </div>

      <div id="lexeme-box" class="lexeme-display">&nbsp;</div>
      <div id="phase-box" class="phase-indicator">READY</div>
    </main>

    <footer class="controls">
      <div class="btn-group">
        <button id="btn-start">START</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-next">NEXT</button>
      </div>

      <div class="btn-group">
        <span>DELAY:</span>
        <!-- Inverted Speedometer: + reduces delay (faster), - increases delay (slower) -->
        <button id="btn-faster" title="Faster (Smaller Delay)">+</button>
        <span id="delay-val" class="speed-readout">900 ms</span>
        <button id="btn-slower" title="Slower (Larger Delay)">-</button>
      </div>
    </footer>
  </div>

  <script>
    // Base paths (GCS Type 1 Imagemes & Viseme Assets)
    const IMAGEME_BASE = "https://storage.googleapis.com/noembalde/imagemes/";
    const VISEME_BASE  = "visemes/"; // Local or repo viseme sprite directory

    // Deterministic Grapheme-to-Viseme Map (Athena Articulation Set)
    const VISEME_MAP = {
      "A": { code: "V01_AA", glyph: "[ AA ]", img: "v_aa.png" },
      "E": { code: "V02_EH", glyph: "[ EH ]", img: "v_eh.png" },
      "I": { code: "V03_IY", glyph: "[ IY ]", img: "v_iy.png" },
      "O": { code: "V04_OW", glyph: "[ OW ]", img: "v_ow.png" },
      "U": { code: "V05_UW", glyph: "[ UW ]", img: "v_uw.png" },
      "B": { code: "V06_BMP", glyph: "[ BMP ]", img: "v_bmp.png" },
      "P": { code: "V06_BMP", glyph: "[ BMP ]", img: "v_bmp.png" },
      "M": { code: "V06_BMP", glyph: "[ BMP ]", img: "v_bmp.png" },
      "F": { code: "V07_FV",  glyph: "[ FV ]",  img: "v_fv.png" },
      "V": { code: "V07_FV",  glyph: "[ FV ]",  img: "v_fv.png" },
      "T": { code: "V08_TDN", glyph: "[ TDN ]", img: "v_tdn.png" },
      "D": { code: "V08_TDN", glyph: "[ TDN ]", img: "v_tdn.png" },
      "N": { code: "V08_TDN", glyph: "[ TDN ]", img: "v_tdn.png" },
      "L": { code: "V09_L",   glyph: "[ L ]",   img: "v_l.png" },
      "R": { code: "V10_R",   glyph: "[ R ]",   img: "v_r.png" },
      "S": { code: "V11_SZ",  glyph: "[ SZ ]",  img: "v_sz.png" },
      "Z": { code: "V11_SZ",  glyph: "[ SZ ]",  img: "v_sz.png" },
      "C": { code: "V12_KG",  glyph: "[ KG ]",  img: "v_kg.png" },
      "K": { code: "V12_KG",  glyph: "[ KG ]",  img: "v_kg.png" },
      "G": { code: "V12_KG",  glyph: "[ KG ]",  img: "v_kg.png" },
      "REST": { code: "V00_REST", glyph: "[ — ]", img: "v_rest.png" }
    };

    // Sample Type-1 Lexical Gestalts (Non-voicing first element in T1/T2 pair)
    const GESTALTS = [
      { word: "CAT",  file: "cat.jpg",  visemes: ["C", "A", "T"] },
      { word: "DOG",  file: "dog.jpg",  visemes: ["D", "O", "G"] },
      { word: "SUN",  file: "sun.jpg",  visemes: ["S", "U", "N"] },
      { word: "MAP",  file: "map.jpg",  visemes: ["M", "A", "P"] },
      { word: "BED",  file: "bed.jpg",  visemes: ["B", "E", "D"] }
    ];

    let currentIndex = 0;
    let baseDelay = 900; // ms (smaller = faster, larger = slower)
    let timerId = null;
    let running = false;

    const imagemeImg = document.getElementById("imageme-img");
    const visemeImg = document.getElementById("viseme-img");
    const visemeFallback = document.getElementById("viseme-fallback");
    const lexemeBox = document.getElementById("lexeme-box");
    const phaseBox = document.getElementById("phase-box");
    const delayVal = document.getElementById("delay-val");

    function renderViseme(key) {
      const v = VISEME_MAP[key] || VISEME_MAP["REST"];
      visemeFallback.textContent = v.glyph;
      visemeImg.src = VISEME_BASE + v.img;
      visemeImg.onload = () => {
        visemeImg.style.display = "block";
        visemeFallback.style.display = "none";
      };
      visemeImg.onerror = () => {
        visemeImg.style.display = "none";
        visemeFallback.style.display = "block";
      };
    }

    function runGestalt(index) {
      clearTimeout(timerId);
      const item = GESTALTS[index % GESTALTS.length];

      // Step 1 (T1): Silent Imageme presentation (first element non-voicing)
      imagemeImg.src = IMAGEME_BASE + item.file;
      lexemeBox.innerHTML = "&nbsp;";
      renderViseme("REST");
      phaseBox.textContent = "T1: IMAGEME (SILENT)";

      timerId = setTimeout(() => {
        if (!running) return;
        // Step 2 (T2): Orthographic Lexeme + Synchronized Viseme Sequence
        lexemeBox.textContent = item.word;
        phaseBox.textContent = "T2: VISEME SEQUENCE";

        let step = 0;
        const stepInterval = Math.max(150, Math.floor(baseDelay / item.visemes.length));

        function nextViseme() {
          if (!running) return;
          if (step < item.visemes.length) {
            renderViseme(item.visemes[step]);
            step++;
            timerId = setTimeout(nextViseme, stepInterval);
          } else {
            renderViseme("REST");
            phaseBox.textContent = "PAUSE";
            timerId = setTimeout(() => {
              if (!running) return;
              currentIndex = (currentIndex + 1) % GESTALTS.length;
              runGestalt(currentIndex);
            }, baseDelay);
          }
        }
        nextViseme();
      }, baseDelay);
    }

    document.getElementById("btn-start").addEventListener("click", () => {
      if (running) return;
      running = true;
      runGestalt(currentIndex);
    });

    document.getElementById("btn-stop").addEventListener("click", () => {
      running = false;
      clearTimeout(timerId);
      renderViseme("REST");
      phaseBox.textContent = "STOPPED";
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      clearTimeout(timerId);
      currentIndex = (currentIndex + 1) % GESTALTS.length;
      if (running) {
        runGestalt(currentIndex);
      } else {
        const item = GESTALTS[currentIndex];
        imagemeImg.src = IMAGEME_BASE + item.file;
        lexemeBox.textContent = item.word;
        renderViseme("REST");
        phaseBox.textContent = "MANUAL STEP";
      }
    });

    // + reduces delay (faster)
    document.getElementById("btn-faster").addEventListener("click", () => {
      baseDelay = Math.max(200, baseDelay - 100);
      delayVal.textContent = baseDelay + " ms";
    });

    // - increases delay (slower)
    document.getElementById("btn-slower").addEventListener("click", () => {
      baseDelay = Math.min(3000, baseDelay + 100);
      delayVal.textContent = baseDelay + " ms";
    });

    // Initial idle state
    imagemeImg.src = IMAGEME_BASE + GESTALTS[0].file;
    renderViseme("REST");
  </script>
</body>
</html>
