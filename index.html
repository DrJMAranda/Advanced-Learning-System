<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KT Silent Egg — Column 1-2-3</title>
<style>
  body {
    margin: 0;
    padding: 8px;
    background: #FAF6EE;
    color: #000000;
    font-family: "Courier New", Courier, monospace;
  }
  #locus {
    width: 300px;
    border: 2px solid #000000;
    background: #FFFFFF;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  #slot-1-img {
    display: block;
    width: 280px;
    height: 190px;
    object-fit: contain;
    border: 1px solid #000000;
  }
  .row {
    height: 36px;
    border: 1px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
  }
  button {
    width: 300px;
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    background: #FFFFFF;
    color: #000000;
    border: 2px solid #000000;
  }
</style>
</head>
<body>
<div id="locus">
  <img id="slot-1-img" src="https://storage.googleapis.com/noenbalde/Imagemes/shark.JPG" alt="shark">
  <div id="slot-2-es" class="row"></div>
  <div id="slot-3-en" class="row"></div>
</div>
<button id="go">PRESENT</button>

<script>
const esEl = document.getElementById("slot-2-es");
const enEl = document.getElementById("slot-3-en");

function beat(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function presentEs(lemma) {
  esEl.textContent = lemma;
  await beat(1200);
}

async function presentEn(lemma) {
  enEl.textContent = lemma;
  await beat(1200);
}

document.getElementById("go").onclick = async () => {
  esEl.textContent = "";
  enEl.textContent = "";
  await presentEs("tiburón");
  await presentEn("shark");
};
</script>
</body>
</html>
