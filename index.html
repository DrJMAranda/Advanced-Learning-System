<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  .console-container {
    position: relative;
    width: 320px; /* Adjust to match your grid width */
    height: 250px; /* Adjust to match your grid height */
  }
  .z-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    border: 2px solid #557;
  }
  #keyboard-layer {
    background: #eef;
    z-index: 1;
  }
  #student-panel-layer {
    background: #fee;
    z-index: 0; /* Hidden underneath by default */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }
  /* Active state for toggling */
  .console-container.show-student #student-panel-layer {
    z-index: 2;
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div class="console-container" id="consoleBox">
  <!-- Layer 0: Sichuan Alpha + Num Board -->
  <div class="z-layer" id="keyboard-layer">
    [ Sichuan Alpha + Num Board ]
  </div>  
  <!-- Layer 1: Simulated Student Panel -->
  <div class="z-layer" id="student-panel-layer">
    [ Simulated Student Panel ]
  </div>
</div>
<button onclick="togglePanel()">Toggle Alpha / Student Panel</button>
<script>
  function togglePanel() {
    const box = document.getElementById('consoleBox');
    box.classList.toggle('show-student');
  }
</script>
</body>
</html>
