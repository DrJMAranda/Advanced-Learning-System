<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tormes â€” Little KTU (Type 0 / Type 1 Micro-Viewport Engine)</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #18202a;
      --stage-bg: #f6f8fa;
      --ink: #0d131a;
      --muted: #5b6878;
      --accent: #0ea5e9;
      --accent-dark: #0284c7;
      --warn: #f59e0b;
      --ok: #10b981;
      --border: #2a3646;
      --mono: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      gap: 8px;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand span {
      font-size: 11px;
      color: #8fb3d9;
      font-family: var(--mono);
    }
    .badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0c2d48;
      color: #7dd3fc;
      border: 1px solid #1e4976;
    }
    .toolbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
    }
    button, label.file-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid #354558;
      background: #222d3b;
      color: #e6edf3;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover, label.file-btn:hover { background: #2c3a4c; }
    button.active {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
    }
    button.sim-on {
      background: #065f46;
      border-color: var(--ok);
      color: #ecfdf5;
    }
    input[type="file"] { display: none; }

    /* Micro-Viewport Frame (0003 Device Handshake) */
    .phone-shell {
      background: #050709;
      border: 2px solid #303d4e;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-width: 100%;
    }
    .phone-shell.vp-240 { width: 258px; }
    .phone-shell.vp-320 { width: 338px; }
    .phone-shell.vp-auto { width: 100%; max-width: 420px; }

    .stage-wrap {
      width: 100%;
      background: var(--stage-bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid #cbd5e1;
    }
    canvas#kteStage {
      display: block;
      width: 100%;
      height: auto;
      background: var(--stage-bg);
    }

    .hud {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
      color: #9fb1c6;
    }
    .hud strong { color: #fff; }
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

      // =========================================================================
      // 2. QUADRANT I (+,+) ROOM RESERVATION MAP (240x320 Logical Grid)
      //    Bottom-left origin: (0, 0), +x right, +y up.
      //    Hardware projection: hwY = LOGICAL_H - (Y + H)
      // =========================================================================
      const LOGICAL_W = 240;
      const LOGICAL_H = 320;
      const ROOMS = {
        P_LEFT:     { x: 10,  y: 170, z: 2, w: 105, h: 135, label: 'VISEME' },
        P_RIGHT:    { x: 125, y: 170, z: 2, w: 105, h: 135, label: 'LATEREME' },
        P_MID:      { x: 10,  y: 78,  z: 2, w: 220, h: 82,  label: 'TEXTEME' },

        P_LOWER:    { x: 10,  y: 10,  z: 1, w: 220, h: 26,  label: 'OCSEME' }
      };

      const LOCUS_COLORS = {
        0: '#ef4444', // Bilabial (Lips)
        1: '#f97316', // Labiodental
        2: '#eab308', // Dental
        3: '#22c55e', // Alveolar
        4: '#14b8a6', // Post-Alveolar
        5: '#06b6d4', // Palatal
        6: '#3b82f6', // Velar
        7: '#6366f1', // Pharyngeal
        8: '#a855f7', // Glottal
        9: '#ec4899'  // Vowel Core
      };

      const VISEME_SHAPES = {
        0: { rx: 14, ry: 2,  open: false, label: '0:Neutral' },
        1: { rx: 24, ry: 6,  open: true,  label: '1:Wide /i,e/' },
        2: { rx: 20, ry: 18, open: true,  label: '2:Open /a/' },
        3: { rx: 10, ry: 11, open: true,  label: '3:Round /o,u/' },
        4: { rx: 18, ry: 4,  open: false, label: '4:Fricative' },
        5: { rx: 18, ry: 1,  open: false, label: '5:Closed /b,p,m/' }
      };

      // =========================================================================
      // 3. STATE & DST PARSER
      // =========================================================================
      let allUnits = [];
      let filteredUnits = [];
      let trackFilter = 'ALL';
      const TRACK_ORDER = ['ALL', 'xo', 'ox', 'T1', 'o'];
      let modeFilter = 'ALL';
      const MODE_ORDER = ['ALL', 'EASY_XFER', 'DECOUPLED', 'ONO', 'T0'];
      let unitIdx = 0;
      let tick = 0;
      let playing = true;
      let simasiaOn = false; // Type 0 Decode-First: OFF by default
      let soundOn = false;
      let viewportMode = 0; // 0: 240x320, 1: 320x480, 2: Auto
      const VIEWPORTS = [
        { cls: 'vp-240', label: '240\u00d7320' },
        { cls: 'vp-320', label: '320\u00d7480' },
        { cls: 'vp-auto', label: 'Auto' }
      ];
      let lastSpokenKey = '';
      const masteryMap = new Map();
      let paretoUnlocked = false;
      let audioCtx = null;

      function parseDST(csvText) {
        const lines = csvText.trim().split(/\r?\n/);
        const unitMap = new Map();
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const cols = [];
          let cur = '', inQ = false;
          for (let c = 0; c < line.length; c++) {
            const ch = line[c];
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
            else { cur += ch; }
          }
          cols.push(cur);
          if (cols.length < 12) continue;
          const uid = cols[0].trim();
          const row = {
            track: cols[1].trim(),
            mode: cols[2].trim(),
            pattern: cols[3].trim(),
            lemma: cols[4].trim(),
            simasia: cols[5].trim(),
            t0: parseInt(cols[6], 10) || 0,
            t1: parseInt(cols[7], 10) || 24,
            viseme: parseInt(cols[8], 10) || 0,
            locus: cols[9].trim() || '[9,2]',
            lang: cols[10].trim() || 'es-ES',
            vox: cols[11].trim()
          };
          if (!unitMap.has(uid)) {
            unitMap.set(uid, {
              id: uid,
              track: row.track,
              mode: row.mode,
              pattern: row.pattern,
              lemma: row.lemma,
              simasia: row.simasia,
              maxTick: row.t1,
              rows: []
            });
          }
          const u = unitMap.get(uid);
          if (row.t1 > u.maxTick) u.maxTick = row.t1;
          u.rows.push(row);
        }
        return Array.from(unitMap.values());
      }

      function applyTrackFilter() {
        filteredUnits = allUnits.filter(u => {
          const okTrack = (trackFilter === 'ALL' || u.track === trackFilter);
          const okMode = (modeFilter === 'ALL' || u.mode === modeFilter);
          return okTrack && okMode;
        });
        if (filteredUnits.length === 0) filteredUnits = allUnits.slice();
        unitIdx = 0;
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
        updateParetoHUD();
      }

      // =========================================================================
      // 4. HARDWARE PROJECTION & RENDERING (Quadrant I -> Canvas)
      // =========================================================================
      const canvas = document.getElementById('kteStage');
      const ctx = canvas.getContext('2d');

      function toHwY(y, h) {
        return LOGICAL_H - (y + h);
      }

      function drawRoomFrame(room, title, bgColor, borderColor) {
        const hy = toHwY(room.y, room.h);
        ctx.fillStyle = bgColor || '#ffffff';
        ctx.fillRect(room.x, hy, room.w, room.h);
        ctx.strokeStyle = borderColor || '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.strokeRect(room.x + 0.5, hy + 0.5, room.w - 1, room.h - 1);
        if (title) {
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 8px "Courier New", monospace';
          ctx.textAlign = 'left';
          ctx.fillText(title, room.x + 4, hy + 10);
        }
        return { x: room.x, y: hy, w: room.w, h: room.h };
      }

      function drawViseme(box, visemeId, locusStr) {
        const cx = box.x + box.w / 2;
        const cy = box.y + box.h / 2 + 6;
        // 20x20 Em sub-grid hint
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 0.5;
        for (let g = -36; g <= 36; g += 18) {
          ctx.beginPath();
          ctx.moveTo(cx + g, cy - 36);
          ctx.lineTo(cx + g, cy + 36);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - 36, cy + g);
          ctx.lineTo(cx + 36, cy + g);
          ctx.stroke();
        }
        // Face ring
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 38, 0, Math.PI * 2);
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(cx - 13, cy - 12, 3, 0, Math.PI * 2);
        ctx.arc(cx + 13, cy - 12, 3, 0, Math.PI * 2);
        ctx.fill();

        // Gilbreth Mouth Puck
        const v = VISEME_SHAPES[visemeId] || VISEME_SHAPES[0];
        const locusDigit = parseInt((locusStr || '[9,2]').replace(/[^0-9]/g, '')[0] || '9', 10);
        const puckColor = LOCUS_COLORS[locusDigit] || '#ec4899';

        ctx.fillStyle = v.open ? '#1e1b2e' : puckColor;
        ctx.strokeStyle = puckColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 14, v.rx, v.ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 9px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(v.label, cx, box.y + box.h - 6);
      }

      function drawLatereme(box, visemeId, locusStr) {
        const ox = box.x + 16;
        const oy = box.y + 18;
        const locusDigit = parseInt((locusStr || '[9,2]').replace(/[^0-9]/g, '')[0] || '9', 10);
        const col = LOCUS_COLORS[locusDigit] || '#ec4899';
        const v = VISEME_SHAPES[visemeId] || VISEME_SHAPES[0];
        const jawDrop = v.open ? Math.min(12, Math.max(3, v.ry * 0.55)) : 0;

        // Side-profile head, forehead, nose, upper/lower lips, chin & neck (facing left)
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(ox + 28, oy + 4);              // crown/forehead top
        ctx.lineTo(ox + 22, oy + 20);             // brow
        ctx.lineTo(ox + 10, oy + 36);             // nose tip
        ctx.lineTo(ox + 22, oy + 40);             // philtrum
        ctx.lineTo(ox + 18, oy + 47);             // upper lip
        ctx.lineTo(ox + 28, oy + 49);             // inner upper mouth
        ctx.lineTo(ox + 28, oy + 51 + jawDrop);   // inner lower mouth
        ctx.lineTo(ox + 18, oy + 51 + jawDrop);   // lower lip
        ctx.lineTo(ox + 21, oy + 63 + jawDrop);   // chin
        ctx.lineTo(ox + 34, oy + 67 + jawDrop);   // under-chin
        ctx.lineTo(ox + 38, oy + 88);             // throat front
        ctx.lineTo(ox + 68, oy + 88);             // neck back
        ctx.lineTo(ox + 74, oy + 48);             // occiput
        ctx.lineTo(ox + 68, oy + 14);             // back of crown
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Side-profile eye
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(ox + 32, oy + 25, 2.3, 0, Math.PI * 2);
        ctx.fill();

        // Inner sagittal vocal tract: palate -> velum -> pharynx
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(ox + 25, oy + 46); // alveolar ridge
        ctx.lineTo(ox + 42, oy + 41); // hard palate
        ctx.lineTo(ox + 54, oy + 47); // velum
        ctx.lineTo(ox + 56, oy + 84); // pharynx wall
        ctx.stroke();

        // Tongue / jaw floor
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(ox + 24, oy + 53 + jawDrop * 0.8);
        ctx.lineTo(ox + 44, oy + 51 + jawDrop * 0.5);
        ctx.lineTo(ox + 50, oy + 63 + jawDrop * 0.3);
        ctx.stroke();

        // Articulatory locus coordinates (0=lips, 1-4=alveolar/palate, 5-7=velum/pharynx, 8=glottis, 9=oral vowel core)
        const locusMap = {
          0: [ox + 18, oy + 49 + jawDrop * 0.4],
          1: [ox + 22, oy + 47],
          2: [ox + 26, oy + 45],
          3: [ox + 31, oy + 43],
          4: [ox + 38, oy + 42],
          5: [ox + 46, oy + 43],
          6: [ox + 53, oy + 48],
          7: [ox + 55, oy + 62],
          8: [ox + 55, oy + 78],
          9: [ox + 37, oy + 49 + jawDrop * 0.35]
        };
        const pt = locusMap[locusDigit] || locusMap[9];
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 9px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LOCUS ' + locusStr, box.x + box.w / 2, box.y + box.h - 6);
      }

      function drawTexteme(box, unit, activeRow) {
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 34px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(unit.lemma, box.x + box.w / 2, box.y + box.h / 2 + 2);

        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(unit.track + ' [' + unit.pattern + '] ' + activeRow.lang, box.x + box.w - 6, box.y + 12);
      }

      function drawSimasiaOculus(box, unit) {
        if (!simasiaOn) {
          // Z3 OFF: clean blank oculus for pure Type 0 decoding
          drawRoomFrame(ROOMS.P_MID_BASE, '', '#e2e8f0', '#cbd5e1');
          ctx.fillStyle = '#64748b';
          ctx.font = '10px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Z3 SIMASIA: OFF (TYPE 0 DECODE)', box.x + box.w / 2, box.y + 16);
          return;
        }
        drawRoomFrame(ROOMS.P_MID_BASE, '', '#ecfdf5', '#10b981');
        ctx.fillStyle = '#064e3b';
        ctx.font = 'bold 12px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(unit.simasia.slice(0, 28), box.x + box.w / 2, box.y + 17);
      }

      function drawOcseme(box, visemeId, activeTick) {
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const midY = box.y + box.h / 2 + 2;
        const amp = visemeId === 0 ? 1 : (visemeId === 2 ? 8 : 5);
        for (let px = 6; px < box.w - 6; px += 4) {
          const py = midY + Math.sin((px + activeTick * 9) * 0.25) * amp;
          if (px === 6) ctx.moveTo(box.x + px, py);
          else ctx.lineTo(box.x + px, py);
        }
        ctx.stroke();
      }

      function getActiveRow(unit, t) {
        for (let i = 0; i < unit.rows.length; i++) {
          const r = unit.rows[i];
          if (t >= r.t0 && t <= r.t1) return r;
        }
        return unit.rows[0];
      }

      function speakVox(row, uid) {
        if (!soundOn || !row.vox) return;
        const key = uid + ':' + row.t0 + ':' + row.vox;
        if (key === lastSpokenKey) return;
        lastSpokenKey = key;

        // Web Audio subtle tick cue + SpeechSynthesis
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 520;
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.06);
        } catch (e) {}

        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(row.vox);
            utter.lang = row.lang || 'es-ES';
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
          } catch (e) {}
        }
      }

      function renderFrame() {
        const unit = filteredUnits[unitIdx];
        if (!unit) return;
        const row = getActiveRow(unit, tick);

        ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

        const bLeft = drawRoomFrame(ROOMS.P_LEFT, 'P-LEFT VISEME');
        const bRight = drawRoomFrame(ROOMS.P_RIGHT, 'P-RIGHT LATEREME');
        const bMid = drawRoomFrame(ROOMS.P_MID, 'P-MID TEXTEME');
        const bSim = {
          x: ROOMS.P_MID_BASE.x,
          y: toHwY(ROOMS.P_MID_BASE.y, ROOMS.P_MID_BASE.h),
          w: ROOMS.P_MID_BASE.w,
          h: ROOMS.P_MID_BASE.h
        };
        const bLower = drawRoomFrame(ROOMS.P_LOWER, 'OCSEME');

        drawViseme(bLeft, row.viseme, row.locus);
        drawLatereme(bRight, row.viseme, row.locus);
        drawTexteme(bMid, unit, row);
        drawSimasiaOculus(bSim, unit);
        drawOcseme(bLower, row.viseme, tick);

        speakVox(row, unit.id);

        document.getElementById('hudUnit').textContent = (unitIdx + 1) + '/' + filteredUnits.length;
        document.getElementById('hudPattern').textContent = unit.pattern;
        document.getElementById('hudTick').textContent = String(tick);
        document.getElementById('hudTotalTicks').textContent = String(unit.maxTick);
        document.getElementById('hudViseme').textContent = String(row.viseme);
        document.getElementById('hudLocus').textContent = row.locus;
      }

      // =========================================================================
      // 5. 25 FPS CLOCK & CONTROLS
      // =========================================================================
      let timerId = null;

      function startClock() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(function () {
          if (!playing || filteredUnits.length === 0) return;
          const unit = filteredUnits[unitIdx];
          tick++;
          if (tick > unit.maxTick) {
            tick = 0;
            unitIdx = (unitIdx + 1) % filteredUnits.length;
            lastSpokenKey = '';
          }
          renderFrame();
        }, 40); // 25 fps = 40 ms
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2200);
      }

      document.getElementById('btnPlay').addEventListener('click', function () {
        playing = !playing;
        this.textContent = playing ? 'Pause' : 'Play';
        this.classList.toggle('active', playing);
      });

      document.getElementById('btnStep').addEventListener('click', function () {
        playing = false;
        const btnPlay = document.getElementById('btnPlay');
        btnPlay.textContent = 'Play';
        btnPlay.classList.remove('active');
        const unit = filteredUnits[unitIdx];
        tick++;
        if (tick > unit.maxTick) {
          tick = 0;
          unitIdx = (unitIdx + 1) % filteredUnits.length;
          lastSpokenKey = '';
        }
        renderFrame();
      });

      document.getElementById('btnPrev').addEventListener('click', function () {
        unitIdx = (unitIdx - 1 + filteredUnits.length) % filteredUnits.length;
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
      });

      document.getElementById('btnNext').addEventListener('click', function () {
        unitIdx = (unitIdx + 1) % filteredUnits.length;
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
      });

      document.getElementById('btnReset').addEventListener('click', function () {
        unitIdx = 0;
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
      });

      document.getElementById('btnTrack').addEventListener('click', function () {
        const nextIdx = (TRACK_ORDER.indexOf(trackFilter) + 1) % TRACK_ORDER.length;
        trackFilter = TRACK_ORDER[nextIdx];
        this.textContent = 'Track: ' + trackFilter;
        applyTrackFilter();
      });

      document.getElementById('btnMode').addEventListener('click', function () {
        const nextIdx = (MODE_ORDER.indexOf(modeFilter) + 1) % MODE_ORDER.length;
        modeFilter = MODE_ORDER[nextIdx];
        this.textContent = 'Mode: ' + modeFilter;
        this.classList.toggle('active', modeFilter !== 'ALL');
        applyTrackFilter();
      });

      document.getElementById('btnSimasia').addEventListener('click', function () {
        simasiaOn = !simasiaOn;
        this.textContent = simasiaOn ? 'Simasia (Z3): ON' : 'Simasia (Z3): OFF';
        this.classList.toggle('sim-on', simasiaOn);
        renderFrame();
      });

      document.getElementById('btnSound').addEventListener('click', function () {
        soundOn = !soundOn;
        this.textContent = soundOn ? 'Sound: ON' : 'Sound: OFF';
        this.classList.toggle('active', soundOn);
        lastSpokenKey = '';
        if (soundOn) renderFrame();
      });

      document.getElementById('btnViewport').addEventListener('click', function () {
        viewportMode = (viewportMode + 1) % VIEWPORTS.length;
        const vp = VIEWPORTS[viewportMode];
        const shell = document.getElementById('phoneShell');
        shell.className = 'phone-shell ' + vp.cls;
        this.textContent = 'Screen: ' + vp.label;
        document.getElementById('handshakeBadge').textContent = '0003: ' + vp.label;
      });

      document.getElementById('csvInput').addEventListener('change', function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const parsed = parseDST(String(ev.target.result || ''));
          if (parsed.length > 0) {
            allUnits = parsed;
            trackFilter = 'ALL';
            document.getElementById('btnTrack').textContent = 'Track: ALL';
            applyTrackFilter();
            showToast('Loaded ' + parsed.length + ' DST units from ' + file.name);
          } else {
            showToast('No valid DST rows found in CSV');
          }
        };
        reader.readAsText(file);
      });

      function updateParetoHUD() {
        const total = filteredUnits.length || 1;
        let ones = 0;
        for (let i = 0; i < filteredUnits.length; i++) {
          if (masteryMap.get(filteredUnits[i].id) === 1) ones++;
        }
        const pct = Math.round((ones / total) * 100);
        const badge = document.getElementById('paretoBadge');
        badge.textContent = 'Binary 1: ' + ones + '/' + total + ' (' + pct + '%)';
        if (pct >= 80 && !paretoUnlocked) {
          paretoUnlocked = true;
          simasiaOn = true;
          const btnSim = document.getElementById('btnSimasia');
          btnSim.textContent = 'Simasia (Z3): ON';
          btnSim.classList.add('sim-on');
          showToast('Pareto 80% Binary 1 reached â€” Simasia (Z3) unlocked!');
          renderFrame();
        }
      }

      document.getElementById('btnMaster1').addEventListener('click', function () {
        const unit = filteredUnits[unitIdx];
        if (!unit) return;
        masteryMap.set(unit.id, 1);
        updateParetoHUD();
        unitIdx = (unitIdx + 1) % filteredUnits.length;
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
      });

      document.getElementById('btnRetry0').addEventListener('click', function () {
        const unit = filteredUnits[unitIdx];
        if (!unit) return;
        masteryMap.set(unit.id, 0);
        updateParetoHUD();
        tick = 0;
        lastSpokenKey = '';
        renderFrame();
      });

      // Boot Tormes
      allUnits = parseDST(DEFAULT_DST_CSV);
      applyTrackFilter();
      updateParetoHUD();
      startClock();
    })();
  </script>
</body>
