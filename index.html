<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEA~ALS | KTU Silent Sequence</title>
  <style>
    :root {
      --bg-paper: #FAF6EE;
      --ink-black: #000000;
      --pewter: #8E9294;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--pewter);
      color: var(--ink-black);
      font-family: 'B612 Mono', 'IBM Plex Mono', 'Courier New', Courier, monospace;
      font-size: 14pt;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.25in;
    }
    .ktu-frame {
      width: 100%;
      max-width: 8.5in;
      min-height: 11in;
      background-color: var(--bg-paper);
      border: 2px solid var(--ink-black);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5in;
    }
    .title-block {
      border-bottom: 2px solid var(--ink-black);
      padding-bottom: 10px;
      line-height: 1.4;
      font-size: 11pt;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px 0;
    }
    .visual-bay {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
    }
    .card-box {
      border: 2px solid var(--ink-black);
      background: #FFFFFF;
      width: 280px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .card-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10pt;
      font-weight: bold;
    }
    .card-box img {
      max-width: 225px;
      max-height: 225px;
      object-fit: contain;
    }
    .viseme-glyph {
      font-size: 44pt;
      font-weight: bold;
    }
    /* Silent-Film Intertitle Style Lexeme Box */
    .intertitle-box {
      width: 100%;
      min-height: 84px;
      border: 3px double var(--ink-black);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 32pt;
      font-weight: bold;
      letter-spacing: 0.18em;
    }
    .phase-indicator {
      font-size: 12pt;
      font-weight: bold;
      height: 24px;
    }
    .controls {
      border-top: 2px solid var(--ink-black);
      padding-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      font-family: inherit;
      font-size: 13pt;
      font-weight: bold;
      background: #FFFFFF;
      color: var(--ink-black);
      border: 2px solid var(--ink-black);
      padding: 8px 16px;
      cursor: pointer;
    }
    button:active {
      background: var(--ink-black);
      color: var(--bg-paper);
    }
    .speed-readout {
      font-size: 13pt;
      font-weight: bold;
      min-width: 84px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ktu-frame">
    <header class="title-block">
      <div>Sistemas de Educación Avanzada&copy; / SEA Bienvenido por</div>
      <div>José M. Aranda-Figueroa, PhD &mdash; en colaboración con Gemini</div>
      <div>jmaf.phd@gmail.com | KTU Silent-Movie Mode (Pure Visual Loop)</div>
    </header>

    <main class="stage">
      <div class="visual-bay">
        <div class="card-box">
          <span class="card-label">IMAGEME [T1]</span>
          <img id="imageme-img" src="" alt="Imageme" />
        </div>

        <div class="card-box">
          <span class="card-label">ATHENA [VISEME]</span>
          <img id="viseme-img" src="" alt="" style="display:none;" />
          <div id="viseme-fallback" class="viseme-glyph">[ — ]</div>
        </div>
      </div>

      <div id="lexeme-box" class="intertitle-box">&nbsp;</div>
      <div id="phase-box" class="phase-indicator">SILENT REEL READY</div>
    </main>

    <footer class="controls">
      <div class="btn-group">
        <button id="btn-start">ROLL</button>
        <button id="btn-stop">CUT</button>
        <button id="btn-next">FRAME +1</button>
      </div>

      <div class="btn-group">
        <span>TEMPO:</span>
        <!-- Inverted Speedometer: + = faster (smaller ms), - = slower (larger ms) -->
        <button id="btn-faster">+</button>
        <span id="delay-val" class="speed-readout">900 ms</span>
        <button id="btn-slower">-</button>
      </div>
    </footer>
  </div>

  <script>
    const IMAGEME_BASE = "https://storage.googleapis.com/noembalde/imagemes/";
    const VISEME_BASE  = "visemes/";

    const VISEME_MAP = {
      "A": { glyph: "[ AA ]",  img: "v_aa.png" },
      "E": { glyph: "[ EH ]",  img: "v_eh.png" },
      "I": { glyph: "[ IY ]",  img: "v_iy.png" },
      "O": { glyph: "[ OW ]",  img: "v_ow.png" },
      "U": { glyph: "[ UW ]",  img: "v_uw.png" },
      "B": { glyph: "[ BMP ]", img: "v_bmp.png" },
      "P": { glyph: "[ BMP ]", img: "v_bmp.png" },
      "M": { glyph: "[ BMP ]", img: "v_bmp.png" },
      "F": { glyph: "[ FV ]",  img: "v_fv.png" },
      "V": { glyph: "[ FV ]",  img: "v_fv.png" },
      "T": { glyph: "[ TDN ]", img: "v_tdn.png" },
      "D": { glyph: "[ TDN ]", img: "v_tdn.png" },
      "N": { glyph: "[ TDN ]", img: "v_tdn.png" },
      "L": { glyph: "[ L ]",   img: "v_l.png" },
      "R": { glyph: "[ R ]",   img: "v_r.png" },
      "S": { glyph: "[ SZ ]",  img: "v_sz.png" },
      "Z": { glyph: "[ SZ ]",  img: "v_sz.png" },
      "C": { glyph: "[ KG ]",  img: "v_kg.png" },
      "K": { glyph: "[ KG ]",  img: "v_kg.png" },
      "G": { glyph: "[ KG ]",  img: "v_kg.png" },
      "REST": { glyph: "[ — ]", img: "v_rest.png" }
    };

    // Pure Silent Sequence: T1 (Silent Imageme) -> T2 (Intertitle + Silent Visemes)
    const REEL = [
      { word: "CAT",  file: "cat.jpg",  visemes: ["C", "A", "T"] },
      { word: "DOG",  file: "dog.jpg",  visemes: ["D", "O", "G"] },
      { word: "SUN",  file: "sun.jpg",  visemes: ["S", "U", "N"] },
      { word: "MAP",  file: "map.jpg",  visemes: ["M", "A", "P"] },
      { word: "BED",  file: "bed.jpg",  visemes: ["B", "E", "D"] }
    ];

    let idx = 0;
    let baseDelay = 900;
    let timerId = null;
    let rolling = false;

    const imagemeImg = document.getElementById("imageme-img");
    const visemeImg = document.getElementById("viseme-img");
    const visemeFallback = document.getElementById("viseme-fallback");
    const lexemeBox = document.getElementById("lexeme-box");
    const phaseBox = document.getElementById("phase-box");
    const delayVal = document.getElementById("delay-val");

    function setViseme(key) {
      const v = VISEME_MAP[key] || VISEME_MAP["REST"];
      visemeFallback.textContent = v.glyph;
      visemeImg.src = VISEME_BASE + v.img;
      visemeImg.onload = () => {
        visemeImg.style.display = "block";
        visemeFallback.style.display = "none";
      };
      visemeImg.onerror = () => {
        visemeImg.style.display = "none";
        visemeFallback.style.display = "block";
      };
    }

    function playFrame(i) {
      clearTimeout(timerId);
      const item = REEL[i % REEL.length];

      // T1: Silent Imageme first (no voice, no text)
      imagemeImg.src = IMAGEME_BASE + item.file;
      lexemeBox.innerHTML = "&nbsp;";
      setViseme("REST");
      phaseBox.textContent = "T1: IMAGEME (SILENT)";

      timerId = setTimeout(() => {
        if (!rolling) return;
        // T2: Intertitle + Silent Viseme Articulation
        lexemeBox.textContent = item.word;
        phaseBox.textContent = "T2: INTERTITLE + VISEMES";

        let step = 0;
        const stepMs = Math.max(150, Math.floor(baseDelay / item.visemes.length));

        function stepViseme() {
          if (!rolling) return;
          if (step < item.visemes.length) {
            setViseme(item.visemes[step]);
            step++;
            timerId = setTimeout(stepViseme, stepMs);
          } else {
            setViseme("REST");
            phaseBox.textContent = "INTER-FRAME PAUSE";
            timerId = setTimeout(() => {
              if (!rolling) return;
              idx = (idx + 1) % REEL.length;
              playFrame(idx);
            }, baseDelay);
          }
        }
        stepViseme();
      }, baseDelay);
    }

    document.getElementById("btn-start").addEventListener("click", () => {
      if (rolling) return;
      rolling = true;
      playFrame(idx);
    });

    document.getElementById("btn-stop").addEventListener("click", () => {
      rolling = false;
      clearTimeout(timerId);
      setViseme("REST");
      phaseBox.textContent = "CUT";
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      clearTimeout(timerId);
      idx = (idx + 1) % REEL.length;
      if (rolling) {
        playFrame(idx);
      } else {
        const item = REEL[idx];
        imagemeImg.src = IMAGEME_BASE + item.file;
        lexemeBox.textContent = item.word;
        setViseme("REST");
        phaseBox.textContent = "STILL FRAME";
      }
    });

    document.getElementById("btn-faster").addEventListener("click", () => {
      baseDelay = Math.max(200, baseDelay - 100);
      delayVal.textContent = baseDelay + " ms";
    });

    document.getElementById("btn-slower").addEventListener("click", () => {
      baseDelay = Math.min(3000, baseDelay + 100);
      delayVal.textContent = baseDelay + " ms";
    });

    imagemeImg.src = IMAGEME_BASE + REEL[0].file;
    setViseme("REST");
  </script>
</body>
</html>
